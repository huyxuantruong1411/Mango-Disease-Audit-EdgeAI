[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mango_edge_cv"
version = "1.0.0"
description = "Auditing Near-Duplicate Leakage and Background Shortcuts in Mango Leaf Disease Classification: An Interpretable, Confidence-Gated Classical Vision Pipeline for CPU Edge Deployment"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Huy Xuan Truong"}
]
keywords = [
    "mango-leaf-disease",
    "MangoLeafBD",
    "MLDID",
    "data-leakage-audit",
    "background-shortcut-audit",
    "edge-ai",
    "classical-computer-vision",
    "block-pca",
    "confidence-gating"
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "opencv-python>=4.8.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.2",
    "joblib>=1.3.0",
    "psutil>=5.9.0",
    "PyYAML>=6.0.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
cnn = ["torch>=2.0.0", "torchvision>=0.15.0"]
dev = ["pytest>=7.4.0"]

[project.urls]
Repository = "https://github.com/huyxuantruong1411/Mango-Disease-Audit-EdgeAI"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

